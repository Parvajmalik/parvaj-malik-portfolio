<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Parvej Malik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css?v=20260330162353" />
    <link rel="stylesheet" href="css/admin.css?v=20260330162353" />
  </head>
  <body>

    <div class="login-wrap">
      <div class="login-card">

        <div class="login-logo">PM</div>
        <h4 class="text-center fw-bold mb-1">Admin Login</h4>
        <p class="text-center text-secondary small mb-4">Sign in to manage your portfolio</p>

        <div id="login-error" class="alert alert-danger d-none mb-3"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label fw-medium">Email</label>
            <input type="email" id="email" class="form-control" placeholder="admin@example.com" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required />
          </div>
          <button type="submit" id="login-btn" class="btn btn-orange rounded-pill w-100 fw-semibold py-2">
            Sign In
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="index.html" class="text-secondary text-decoration-none small">
            <i class="bi bi-arrow-left me-1"></i>Back to portfolio
          </a>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js?v=20260330162353"></script>
  </body>
</html>
